<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ReVeste — Ofertas da Comunidade</title>
<style>
:root{--ink:#112319;--bg:#f6f7f4}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#10251b,#1f5a3c);color:#fff;padding:22px 7% 65px}nav{display:flex;justify-content:space-between;align-items:center;gap:20px}.logo{font-size:28px;font-weight:900}.logo span{color:#8df0b6}.back{color:#fff;text-decoration:none;background:#ffffff18;border:1px solid #ffffff35;padding:11px 17px;border-radius:25px;font-weight:bold}.hero{max-width:1000px;margin:65px auto 0}.tag{display:inline-block;background:#ffffff18;padding:8px 13px;border-radius:20px}h1{font-size:clamp(42px,7vw,78px);line-height:.95;margin:20px 0}p{line-height:1.6}
main{padding:55px 7%;max-width:1450px;margin:auto}.filters{background:#fff;padding:18px;border-radius:22px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:10px;box-shadow:0 12px 30px #17301d10}input,select{padding:13px;border:1px solid #d7e2d9;border-radius:12px;background:#fbfcfb;width:100%}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:28px}.card{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 10px 28px #17301d12;transition:.2s}.card:hover{transform:translateY(-5px)}.photo{height:205px;background:linear-gradient(135deg,#d8eddd,#9dcbab);display:flex;align-items:center;justify-content:center;font-size:80px}.info{padding:18px}.badge{display:inline-block;background:#e8f7ed;color:#197444;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:900}.meta{font-size:13px;color:#617067;line-height:1.7}.interest{width:100%;margin-top:12px;padding:11px;border:0;border-radius:12px;background:#1d8f59;color:#fff;font-weight:900;cursor:pointer}.empty{grid-column:1/-1;text-align:center;padding:50px;background:#fff;border-radius:20px}footer{padding:45px 7%;background:#0b1710;color:#d2ded5;margin-top:50px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid,.filters{grid-template-columns:1fr}header,main{padding-left:6%;padding-right:6%}}
</style></head><body>
<header><nav><div class="logo">RE<span>VESTE</span> ♻</div><a class="back" href="index.html">← Voltar para o início</a></nav>
<div class="hero"><span class="tag">👥 Ofertas publicadas pela comunidade</span><h1>Encontre a próxima história da sua roupa.</h1><p>Explore peças para venda, troca e doação. Filtre por tamanho, marca e qualidade.</p></div></header>
<main><h2>Ofertas da comunidade</h2><div class="filters"><input id="search" placeholder="🔎 Buscar peça ou marca"><select id="type"><option value="">Tipo: todos</option><option>Venda</option><option>Troca</option><option>Doação</option></select><select id="size"><option value="">Tamanho: todos</option><option>PP</option><option>P</option><option>M</option><option>G</option><option>GG</option></select><select id="quality"><option value="">Qualidade: todas</option><option>Como nova</option><option>Excelente</option><option>Boa</option><option>Usada, mas em bom estado</option></select><select id="brand"><option value="">Marca: todas</option></select><select id="region"><option value="">Região: todas</option><option>Norte</option><option>Nordeste</option><option>Centro-Oeste</option><option>Sudeste</option><option>Sul</option></select></div><div class="grid" id="grid"></div></main>
<footer><div class="logo">RE<span>VESTE</span> ♻</div><p>Venda. Troque. Doe. Faça circular.</p></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://rvimgfwlxfdjtusnfhvm.supabase.co";
const SUPABASE_ANON_KEY="https://rvimgfwlxfdjtusnfhvm.supabase.co";
const CLOUD_ENABLED=!SUPABASE_URL.startsWith("COLE_AQUI")&&!SUPABASE_ANON_KEY.startsWith("COLE_AQUI");
const sb=CLOUD_ENABLED?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;

const offers=[
  {name:'Jaqueta jeans vintage',type:'Troca',size:'M',brand:'Levis',quality:'Excelente',owner:'Ana',emoji:'🧥',region:'Sudeste'},
  {name:'Vestido floral',type:'Venda',size:'P',brand:'Zara',quality:'Como nova',owner:'Mariana',emoji:'👗',region:'Sul'},
  {name:'Camiseta esportiva',type:'Troca',size:'G',brand:'Nike',quality:'Boa',owner:'Lucas',emoji:'👕',region:'Nordeste'}
];

const brandSelect=document.getElementById('brand');

function refreshBrands(){
  const current=brandSelect.value;
  const brands=[...new Set(offers.map(o=>o.brand).filter(Boolean))].sort();
  brandSelect.innerHTML='<option value="">Marca: todas</option>'+brands.map(b=>`<option>${b}</option>`).join('');
  if(brands.includes(current)) brandSelect.value=current;
}

function escapeHtml(value=''){
  return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

function render(){
  const q=search.value.toLowerCase(),
        t=type.value,
        s=size.value,
        ql=quality.value,
        b=brand.value,
        r=region.value;

  const result=offers.filter(o =>
    (!q || [o.name,o.brand,o.owner,o.region].join(' ').toLowerCase().includes(q)) &&
    (!t || o.type===t) &&
    (!s || o.size===s) &&
    (!ql || o.quality===ql) &&
    (!b || o.brand===b) &&
    (!r || o.region===r)
  );

  grid.innerHTML=result.length
    ? result.map(o=>`
      <article class="card">
        <div class="photo">${o.emoji||'👕'}</div>
        <div class="info">
          <span class="badge">${escapeHtml(o.type)}</span>
          <h3>${escapeHtml(o.name)}</h3>
          <div class="meta">
            <b>👤 ${escapeHtml(o.owner)}</b><br>
            📍 Região: ${escapeHtml(o.region||'Não informada')}<br>
            🏷️ Marca: ${escapeHtml(o.brand||'Não informada')}<br>
            📏 Tamanho: ${escapeHtml(o.size||'Não informado')}<br>
            ✨ Estado: ${escapeHtml(o.quality||'Não informado')}
          </div>
          <button class="interest" onclick="alert('Interesse registrado na demonstração.')">Tenho interesse</button>
        </div>
      </article>`).join('')
    : '<div class="empty">Nenhuma oferta encontrada com esses filtros.</div>';
}

async function loadCloudOffers(){
  if(!CLOUD_ENABLED){ refreshBrands(); render(); return; }

  const {data,error}=await sb.from('offers').select('*').order('created_at',{ascending:false});
  if(error){
    console.error(error);
    grid.innerHTML='<div class="empty">Não foi possível carregar as ofertas. Verifique a configuração do Supabase.</div>';
    return;
  }

  offers.splice(0,offers.length,...(data||[]).map(o=>({
    id:o.id,
    name:o.name,
    type:o.type,
    size:o.size,
    brand:o.brand,
    quality:o.quality,
    owner:o.owner_name||'Comunidade ReVeste',
    emoji:o.emoji||'👕',
    region:o.region||'Não informada'
  })));

  refreshBrands();
  render();
}

document.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',render));
document.querySelectorAll('select').forEach(x=>x.addEventListener('change',render));
window.addEventListener('load',loadCloudOffers);
refreshBrands();
render();
</script>

</body></html>
